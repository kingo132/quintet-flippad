import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.*

plugins { id 'com.android.application' }

abstract class PrivateGameAssets extends DefaultTask {
 @InputFile @PathSensitive(PathSensitivity.NONE)
 abstract RegularFileProperty getGameRom()
 @OutputDirectory abstract DirectoryProperty getOutputDirectory()
 @TaskAction void generate() {
  File target=new File(outputDirectory.get().asFile,'private/game.sfc')
  target.parentFile.mkdirs()
  java.nio.file.Files.copy(gameRom.get().asFile.toPath(),target.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
 }
}
android {
 namespace 'local.sfc.tall'
 compileSdk 37
 buildToolsVersion '37.0.0'
 defaultConfig { minSdk 26; targetSdk 37; versionCode 4; versionName '0.1.3' }
 flavorDimensions 'game'
 productFlavors {
  soulblazer { dimension 'game'; applicationId 'local.games.soulblazer' }
  terranigma { dimension 'game'; applicationId 'local.games.terranigma' }
 }
 buildFeatures { buildConfig true }
 buildTypes { debug { applicationIdSuffix '.qa'; versionNameSuffix '-qa' }; release { signingConfig signingConfigs.debug; debuggable false } }
 sourceSets {
  main { java.srcDirs=['../../android/src']; res.srcDirs=['../../android/res']; manifest.srcFile '../../android/AndroidManifest.xml' }
 }
}
// Only local private builds package the user's game. CI builds source without it.
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
 def game=variant.flavorName
 if(project.hasProperty(game+'Rom')) {
  def privateAssets=tasks.register('bundle'+variant.name.capitalize()+'Rom',PrivateGameAssets) {
   gameRom.set(project.file(project.property(game+'Rom')))
  }
  // AGP's generated-source API carries the dependency through merge and lint.
  variant.sources.assets.addGeneratedSourceDirectory(privateAssets) { it.outputDirectory }
 }
}
